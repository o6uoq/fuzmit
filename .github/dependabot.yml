version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "🤖 chore(ci)"
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 3
    groups:
      go-dependencies:
        patterns:
          - "*"
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: "🤖 chore(deps)"
    labels:
      - dependencies
      - go
